# occ_grid_mapping parameters for the UNIST 112 8th-floor world (UNIST_indoor.world).
# Same as the package's default.yaml except the map size, kept small so /map (117 KB) reaches
# every node with default transports -- see ../occ_grid_hospital.yaml for why that matters.
#
# Map frame = chain_robot's spawn = world (-0.5, -6). Floor in the map frame:
#   x -28.1 .. 28.4,  y -3.6 .. 13.0   ->  grid x -30 .. 30, y -5 .. 15 (600 x 200 cells = 117 KB)
mapping:
  ros__parameters:
    mapping:
      map:
        sizex: 600
        sizey: 200
        initx: 300
        inity: 50
        cell_size: 0.1
      robot_laser:
        x: 0.0
        y: 0.0
        theta: 0.0
      sensor_model:
        P_occ: 0.99
        P_free: 0.3
        P_prior: 0.5
      gap_thresh: 0.1
      occ_thresh: 0.50005
      free_thresh: 0.49995
      r_max: 7.0
