# Nodes for the UNIST world (hospital_world/unist/unist_indoor.world). The FIRST entry is the GCS.
# Same format as nodes.yaml. World = pose + offset:
#   relays : the drive plugin publishes the model's WORLD pose          -> offset 0
#   head   : FAST-LIO /Odometry starts at chain_robot's spawn (-0.5, -6) -> offset (-0.5, -6)
gcs:
  # A virtual radio (no body) in the corridor 2 m east of chain_robot's spawn.
  xy: [1.5, -6.1]

# park: one relay per alcove between the room blocks on the south wall, off the corridor
# (each alcove fits one car: 0.85 m clearance at these spots)
relay1:
  topic: /relay1/odom
  offset: [0.0, 0.0]
  park: [-1.05, -7.6]

relay2:
  topic: /relay2/odom
  offset: [0.0, 0.0]
  park: [6.7, -7.6]

head:
  topic: /Odometry
  offset: [-0.5, -6.0]
